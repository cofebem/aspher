[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "aspher"
version = "0.1.0"
description = "ASPHER — Accelerated SPectral and HiERarchical contact solver: BEM normal contact on an elastic half-space (exact Love/Boussinesq kernel, H-matrix and matrix-free H2/FMM operators, FFTW |q| spectral preconditioner, nested-grid mixed-precision Polonsky–Keer CG)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "V.A. Yastrebov" },
  { name = "Claude (Anthropic)" },
]
keywords = [
  "contact mechanics", "rough surfaces", "boundary element method",
  "H-matrix", "fast multipole method", "tribology", "elasticity",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/cofebem/aspher"
Mirror = "https://src.koda.cnrs.fr/vyastreb/aspher"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
# the extension module and the compat shim are installed by CMake (SKBUILD
# branch of CMakeLists.txt); there is no pure-Python package directory
wheel.packages = []
sdist.exclude = [
  "*.png", "*.jpg", "*.pdf", "*.npy",
  "doc/", "data/", "experiments/", "build/", "dist/",
  "Rough_contact_*", "bench_*.py", "compare_*.py", "visualize_*.py",
  "leaf_size_bench.py", "convergence_study.py", "curved_convergence_study.py",
  "tamaas_reference.py",
]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
